<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Catálogo Neumasur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-section">
                <a href="index.html">
                    <img src="img/LOGO.png" alt="Logo de Neumasur" class="logo">
                </a>
            </div>
            <h1>Panel de Administración</h1>
        </div>
    </header>

    <main class="main-content">
        <div id="login-section" class="admin-card">
            <h2>Acceso de Administrador</h2>
            <p>Introduce la contraseña para gestionar el catálogo.</p>
            <input type="password" id="password-input" placeholder="Contraseña">
            <button id="login-button" class="btn-admin">Entrar</button>
        </div>

        <div id="admin-panel" style="display: none;">
            <div class="admin-actions">
                <button id="add-product-btn" class="btn-admin btn-add">Añadir Nuevo Producto</button>
                <button id="export-json-btn" class="btn-admin btn-save">Guardar y Exportar JSON</button>
            </div>
            <div id="product-list-admin">
                <!-- La lista de productos se cargará aquí -->
            </div>
        </div>
    </main>

    <!-- Modal para Añadir/Editar Producto -->
    <div id="product-modal-admin" class="modal-overlay">
        <div class="modal-content">
            <button id="modal-close-admin" class="modal-close-btn">&times;</button>
            <form id="product-form">
                <h3 id="form-title">Añadir Producto</h3>
                <input type="hidden" id="form-mode" value="add">
                <input type="text" id="marca" placeholder="Marca (ej: Black Rhino)" required>
                <input type="text" id="codigo" placeholder="Código (ej: FBX106)" required>
                <input type="text" id="aro" placeholder="Aro(s) (separados por coma, ej: 16,17)">
                <input type="text" id="medida" placeholder="Medida (ej: 16x8.5)">
                <input type="text" id="apernadura" placeholder="Apernadura(s) (separadas por coma, ej: 6x139.7)">
                <input type="text" id="color" placeholder="Color">
                <input type="number" id="precio" placeholder="Precio (sin puntos, ej: 439000)">
                <input type="text" id="imagen" placeholder="Ruta de imagen (sin .jpg, ej: img/MARCA/CODIGO/aro-16/img)">
                <textarea id="descripcion" placeholder="Descripción (opcional)"></textarea>
                <button type="submit" class="btn-admin">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script src="admin.script.js"></script>
</body>
</html>
